<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/allPageStyle.css" />
    <title>Document</title>
</head>
<body>
    <header></header>
    <main></main>
    <div class="floating-icons">
        <!-- Floating chat icon -->
        <div class="floating-chat" id="chat-icon">
            <svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 512 512"
                 height="48px" width="48px" xmlns="http://www.w3.org/2000/svg"
                 style="color: #fc9e00; cursor: pointer; font-size: 38px; padding: 6px;
                        border-radius: 50%; background: #fcdca7; box-sizing: border-box;">
                <path d="M425.9 170.4H204.3c-21 0-38.1 17.1-38.1 38.1v154.3c0 21 17.1 38 38.1 38h126.8c2.8 0 5.6 1.2 7.6 3.2l63 58.1c3.5 3.4 9.3 2 9.3-2.9v-50.6c0-6 3.8-7.9 9.8-7.9h1c21 0 42.1-16.9 42.1-38V208.5c.1-21.1-17-38.1-38-38.1z"></path>
                <path d="M174.4 145.9h177.4V80.6c0-18-14.6-32.6-32.6-32.6H80.6C62.6 48 48 62.6 48 80.6v165.2c0 18 14.6 32.6 32.6 32.6h61.1v-99.9c.1-18 14.7-32.6 32.7-32.6z"></path>
            </svg>
        </div>
    </div>
    
    <!-- Chat popup -->
    <div class="chat-popup" id="chat-popup">
        <div class="chat-popup-logo">
            <img src="/logo.png" alt="logo">
            <!-- Close button -->
            <div class="close-btns" id="closeBtns" style="cursor: pointer;">
                <div style="cursor: pointer; height: 1px; width: 14px; background-color: rgb(200, 200, 200);"></div>
                <svg width="25px" height="25px" viewBox="0 0 25 25" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="24" height="24" fill="white"></rect>
                    <path d="M7 17L16.8995 7.10051" stroke="#c8c8c8" stroke-linecap="round" stroke-linejoin="round"></path>
                    <path d="M7 7.00001L16.8995 16.8995" stroke="#c8c8c8" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
            </div>
        </div>

        <!-- Chat text -->
        <div class="chat-text">
            მადლობას გიხდით დაკავშირებისთვის. თქვენ მოგვწერეთ არასამუშაო დროს.
            გთხოვთ, კონსულტაციის მისაღებად მოგვმართოთ 09:30-19:30 დროის მონაკვეთში
            ან შეტყობინება დაგვიტოვოთ ზუმერის FB-გვერდზე
            https://www.facebook.com/zoommerge
        </div>
        
        <div>
            <p>Powered By</p>
        </div>
    </div>
    </div>
    <script src="/script.js"></script>
    <script src="/icons.js"></script>
</body>
</html>
